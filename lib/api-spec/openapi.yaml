openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: chat
    description: AI chat operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /chat/completions:
    post:
      operationId: streamChatCompletion
      tags: [chat]
      summary: Stream an assistant response to a conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatCompletionInput"
      responses:
        "200":
          description: Server-sent events containing assistant text chunks
          content:
            text/event-stream: {}
        "400":
          description: Invalid chat messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Chat generation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Supabase storage or the AI service is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /chat/conversations:
    get:
      operationId: listChatConversations
      tags: [chat]
      summary: List this browser's saved conversations
      responses:
        "200":
          description: Saved conversations, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConversationSummary"
        "503":
          description: Supabase storage is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createChatConversation
      tags: [chat]
      summary: Create a saved conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationInput"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationSummary"
        "400":
          description: Invalid conversation title
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Supabase storage is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /chat/conversations/{conversationId}:
    parameters:
      - name: conversationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getChatConversation
      tags: [chat]
      summary: Load a saved conversation
      responses:
        "200":
          description: Conversation and its messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationDetail"
        "404":
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Supabase storage is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteChatConversation
      tags: [chat]
      summary: Delete a saved conversation
      responses:
        "204":
          description: Conversation deleted
        "404":
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Supabase storage is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ChatCompletionInput:
      type: object
      properties:
        conversationId:
          type: string
          format: uuid
        messages:
          type: array
          minItems: 1
          maxItems: 40
          items:
            $ref: "#/components/schemas/ChatMessage"
      required:
        - conversationId
        - messages
    ChatMessage:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          minLength: 1
          maxLength: 12000
      required:
        - role
        - content
    ConversationInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
      required:
        - title
    ConversationSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - createdAt
        - updatedAt
    ConversationDetail:
      allOf:
        - $ref: "#/components/schemas/ConversationSummary"
        - type: object
          properties:
            messages:
              type: array
              items:
                $ref: "#/components/schemas/ChatMessageRecord"
          required:
            - messages
    ChatMessageRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - role
        - content
        - createdAt
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

