kind = "web"
previewPath = "/"
title = "Simple AI Chatbot"
description = "A simple AI chat app for asking questions and having clear, helpful conversations. Messages stream as the assistant responds, with a fresh-chat action for starting over."
version = "1.0.0"
id = "artifacts/simple-ai-chatbot"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21530

[services.development]
run = "pnpm --filter @workspace/simple-ai-chatbot run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/simple-ai-chatbot", "run", "build" ]
serve = "static"
publicDir = "artifacts/simple-ai-chatbot/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21530"
BASE_PATH = "/"
